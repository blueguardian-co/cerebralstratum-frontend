# Included inside the default server block (NGINX_DEFAULT_CONF_PATH).

# React Router uses client-side routing, so any path without a matching
# static file (e.g. /dashboard) must fall back to index.html instead of 404s.
error_page 404 = /index.html;

# env.js (ADR-0006) is rendered by docker-entrypoint.sh to a dedicated
# writable path outside the static docroot — see that script for why.
location = /env.js {
    alias /var/run/env-js/env.js;
}
